<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto - Perú Turístico</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <header>
        <!-- Mismo navbar que index.html -->
    </header>

    <main>
        <h2>Contáctanos</h2>
        
        <form class="contact-form" action="#" method="POST">
            <div class="form-group">
                <label for="nombre">Nombre completo:</label>
                <input type="text" id="nombre" name="nombre" required>
            </div>

            <div class="form-group">
                <label for="email">Correo electrónico:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="telefono">Teléfono:</label>
                <input type="tel" id="telefono" name="telefono">
            </div>

            <div class="form-group">
                <label for="destino">Destino de interés:</label>
                <select id="destino" name="destino">
                    <option value="">Selecciona un destino</option>
                    <option value="machu-picchu">Machu Picchu</option>
                    <option value="nazca">Líneas de Nazca</option>
                    <option value="titicaca">Lago Titicaca</option>
                </select>
            </div>

            <div class="form-group">
                <label for="mensaje">Mensaje:</label>
                <textarea id="mensaje" name="mensaje" rows="5" required></textarea>
            </div>

            <div class="form-group">
                <label for="newsletter">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    Suscribirse al newsletter
                </label>
            </div>

            <button type="submit" class="submit-btn">Enviar Consulta</button>
        </form>
    </main>

    <footer>
        <p>&copy; 2024 Perú Turístico</p>
    </footer>
</body>
</html>
